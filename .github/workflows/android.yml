name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish releases

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # Works whether the repo holds the project files or just an uploaded Sawti.zip.
      - name: Find the project
        run: |
          root="$GITHUB_WORKSPACE"
          if ! find . -name settings.gradle.kts -not -path "./.git/*" | grep -q .; then
            zip=$(find . -maxdepth 2 -name "*.zip" -not -path "./.git/*" | head -n 1)
            if [ -n "$zip" ]; then
              echo "Unzipping $zip"
              unzip -q "$zip" -d "$RUNNER_TEMP/src"
              root="$RUNNER_TEMP/src"
            fi
          fi
          settings=$(find "$root" -name settings.gradle.kts -not -path "*/.git/*" | head -n 1)
          if [ -z "$settings" ]; then
            echo "::error::No Android project found. Upload Sawti.zip (or the unzipped files) to the top of the repo."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$settings")" >> "$GITHUB_ENV"
          echo "Building $(dirname "$settings")"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The project has no gradlew; this installs the exact Gradle version instead.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Set version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "SAWTI_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "SAWTI_VERSION_NAME=0.1.${GITHUB_RUN_NUMBER}-dev" >> "$GITHUB_ENV"
          fi
          echo "SAWTI_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Load signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.SAWTI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SAWTI_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key."
          else
            echo "::warning::No SAWTI_KEYSTORE_BASE64 secret; the APK is signed with a throwaway debug key, so updates won't install over each other."
          fi

      - name: Unit tests
        run: gradle --no-daemon -p "$PROJECT_DIR" testDebugUnitTest

      - name: Build release APK
        env:
          SAWTI_KEYSTORE_PASSWORD: ${{ secrets.SAWTI_KEYSTORE_PASSWORD }}
          SAWTI_KEY_ALIAS: ${{ secrets.SAWTI_KEY_ALIAS }}
          SAWTI_KEY_PASSWORD: ${{ secrets.SAWTI_KEY_PASSWORD }}
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          cp "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" "dist/Sawti-${SAWTI_VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Sawti-${{ env.SAWTI_VERSION_NAME }}
          path: dist/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
